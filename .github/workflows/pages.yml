name: Deploy GitHub Pages

on:
  push:
    branches:
      - web-port
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - "app/src/main/assets/calculators/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm install --prefix web/frontend --no-audit --no-fund

      - name: Typecheck and build frontend
        run: npm run build --prefix web/frontend

      - name: Build WebAssembly
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:latest \
            sh -lc 'emcmake cmake -S web -B build/pages && cmake --build build/pages --target webemu48 --parallel 2'
          sudo chown -R "$(id -u):$(id -g)" build/pages

      - name: Assemble Pages site
        run: |
          rm -rf _site
          cp -R web/frontend/dist _site
          mkdir -p _site/runtime
          cp build/pages/webemu48.* _site/runtime/
          test -f _site/index.html
          test -f _site/runtime/webemu48.js
          test -f _site/skins/hp39gplus.svg
          test -f _site/skins/hp50g.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
