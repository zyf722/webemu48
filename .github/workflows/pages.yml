name: Deploy GitHub Pages

on:
  push:
    branches:
      - web-port
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - "app/src/main/assets/calculators/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build WebAssembly
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:latest \
            sh -lc 'emcmake cmake -S web -B build/pages && cmake --build build/pages --target webemu48 --parallel 2'
          sudo chown -R "$(id -u):$(id -g)" build/pages

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp build/pages/webemu48.* _site/
          cp web/demo/index.html _site/
          cp web/demo/demo.js _site/
          cp web/demo/bootstrap.js _site/
          cp web/demo/coi-serviceworker.js _site/
          cp app/src/main/assets/calculators/real39gp-lc.png _site/
          cp app/src/main/assets/calculators/real39gs-lc.png _site/
          cp app/src/main/assets/calculators/real40gs-lc.png _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
