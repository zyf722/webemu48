name: WebAssembly smoke

on:
  push:
    branches:
      - web-port
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - ".github/workflows/web-wasm.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - ".github/workflows/web-wasm.yml"

permissions:
  contents: read

jobs:
  portability-probe:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Emscripten version
        run: emcc --version

      - name: Configure compile-only probe
        run: emcmake cmake -S web -B build/web

      - name: Build compile-only probe
        run: cmake --build build/web --parallel 2 --verbose

      - name: Assemble browser demo
        run: |
          mkdir -p dist
          cp build/web/webemu48.js dist/
          cp build/web/webemu48.wasm dist/
          cp build/web/webemu48.worker.js dist/
          cp build/web/webemu48.data dist/
          cp web/demo/index.html dist/
          cp web/demo/demo.js dist/
          cp web/demo/serve.py dist/

      - name: Upload browser demo
        uses: actions/upload-artifact@v4
        with:
          name: webemu48-browser-demo
          path: dist/
          if-no-files-found: error
