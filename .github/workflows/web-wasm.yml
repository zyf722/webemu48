name: WebAssembly smoke

on:
  push:
    branches:
      - web-port
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - "app/src/main/assets/calculators/**"
      - ".github/workflows/web-wasm.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - "app/src/main/assets/calculators/**"
      - ".github/workflows/web-wasm.yml"

permissions:
  contents: read

concurrency:
  group: web-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability-probe:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Emscripten version
        run: emcc --version

      - name: Configure compile-only probe
        run: emcmake cmake -S web -B build/web

      - name: Build compile-only probe
        run: cmake --build build/web --parallel 2 --verbose

      - name: Assemble browser demo
        run: |
          mkdir -p dist
          cp build/web/webemu48.* dist/
          test -f dist/webemu48.js
          test -f dist/webemu48.wasm
          test -f dist/webemu48.data
          cp web/demo/index.html dist/
          cp web/demo/demo.js dist/
          cp web/demo/bootstrap.js dist/
          cp web/demo/coi-serviceworker.js dist/
          cp web/demo/serve.py dist/
          cp app/src/main/assets/calculators/real39gp-lc.png dist/
          cp app/src/main/assets/calculators/real39gs-lc.png dist/
          cp app/src/main/assets/calculators/real40gs-lc.png dist/

      - name: Upload browser demo
        uses: actions/upload-artifact@v4
        with:
          name: webemu48-browser-demo
          path: dist/
          if-no-files-found: error

  browser-runtime-smoke:
    needs: portability-probe
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - 39gp
          - 39gs
          - 40gs
    steps:
      - uses: actions/checkout@v4

      - name: Download browser demo
        uses: actions/download-artifact@v4
        with:
          name: webemu48-browser-demo
          path: dist

      - name: Prepare runtime smoke
        run: |
          cp web/demo/smoke.html dist/
          cp web/demo/smoke.js dist/
          cp app/src/main/assets/calculators/rom.39g dist/rom.39g

      - name: Start cross-origin-isolated server
        run: |
          cd dist
          nohup python3 serve.py > /tmp/webemu48-server.log 2>&1 &
          echo $! > /tmp/webemu48-server.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/smoke.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/webemu48-server.log
          exit 1

      - name: Run Chromium runtime smoke
        env:
          SMOKE_MODEL: ${{ matrix.model }}
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/webemu48-chrome \
            about:blank \
            > /tmp/webemu48-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          node <<'NODE'
          const model = process.env.SMOKE_MODEL || "39gp";
          const targetUrl =
            "http://127.0.0.1:8000/smoke.html?model=" + encodeURIComponent(model);
          const targetResponse = await fetch(
            "http://127.0.0.1:9222/json/new?" + encodeURIComponent(targetUrl),
            { method: "PUT" }
          );
          if (!targetResponse.ok) {
            throw new Error("Could not create Chromium target: " + targetResponse.status);
          }

          const target = await targetResponse.json();
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener("message", event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(JSON.stringify(message.error)));
            else waiter.resolve(message.result);
          });

          function cdp(method, params = {}) {
            const id = nextId++;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }

          await cdp("Runtime.enable");

          const deadline = Date.now() + 35000;
          let last = { state: "loading", text: "Loading WebAssembly module" };

          while (Date.now() < deadline) {
            const result = await cdp("Runtime.evaluate", {
              expression: `JSON.stringify({
                state: document.documentElement.dataset.smoke || "loading",
                text: document.getElementById("status")?.textContent || ""
              })`,
              returnByValue: true
            });

            const value = result?.result?.value;
            if (value) last = JSON.parse(value);

            if (last.state === "pass") {
              console.log(last.text);
              socket.close();
              process.exit(0);
            }

            if (last.state === "fail") {
              console.error(last.text);
              socket.close();
              process.exit(1);
            }

            await new Promise(resolve => setTimeout(resolve, 250));
          }

          console.error("Timed out waiting for smoke result:", last);
          socket.close();
          process.exit(1);
          NODE
