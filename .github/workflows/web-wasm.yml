name: WebAssembly smoke

on:
  push:
    branches:
      - web-port
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - "app/src/main/assets/calculators/**"
      - ".github/workflows/web-wasm.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/src/main/cpp/**"
      - "app/src/main/assets/calculators/**"
      - ".github/workflows/web-wasm.yml"

permissions:
  contents: read

concurrency:
  group: web-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm install --prefix web/frontend --no-audit --no-fund

      - name: Typecheck and build frontend
        run: npm run build --prefix web/frontend

      - name: Build WebAssembly
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:latest \
            sh -lc 'emcmake cmake -S web -B build/web && cmake --build build/web --parallel 2 --verbose'
          sudo chown -R "$(id -u):$(id -g)" build/web

      - name: Assemble browser site
        run: |
          rm -rf dist
          cp -R web/frontend/dist dist
          mkdir -p dist/runtime
          cp build/web/webemu48.* dist/runtime/
          cp web/demo/serve.py dist/
          test -f dist/index.html
          test -f dist/runtime/webemu48.js
          test -f dist/runtime/webemu48.wasm
          test -f dist/runtime/webemu48.data
          test -f dist/skins/hp39gplus.svg
          test -f dist/skins/hp50g.svg

      - name: Upload browser site
        uses: actions/upload-artifact@v4
        with:
          name: webemu48-browser-site
          path: dist/
          if-no-files-found: error

  browser-demo-ui:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download browser site
        uses: actions/download-artifact@v4
        with:
          name: webemu48-browser-site
          path: dist

      - name: Start cross-origin-isolated server
        run: |
          cd dist
          nohup python3 serve.py > /tmp/webemu48-ui-server.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/webemu48-ui-server.log
          exit 1

      - name: Run Chromium demo UI smoke
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/webemu48-ui-chrome \
            about:blank \
            > /tmp/webemu48-ui-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          node <<'NODE'
          const targetUrl = "http://127.0.0.1:8000/index.html";
          const targetResponse = await fetch(
            "http://127.0.0.1:9222/json/new?" + encodeURIComponent(targetUrl),
            { method: "PUT" }
          );
          if (!targetResponse.ok) throw new Error("Could not create Chromium target: " + targetResponse.status);

          const target = await targetResponse.json();
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener("message", event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(JSON.stringify(message.error)));
            else waiter.resolve(message.result);
          });

          function cdp(method, params = {}) {
            const id = nextId++;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }

          async function evaluate(expression) {
            const result = await cdp("Runtime.evaluate", { expression, returnByValue: true });
            if (result?.exceptionDetails) throw new Error(JSON.stringify(result.exceptionDetails));
            return result?.result?.value;
          }

          await cdp("Runtime.enable");

          const deadline = Date.now() + 30000;
          let status = "";
          while (Date.now() < deadline) {
            status = await evaluate('document.querySelector("#bootstrap-status")?.textContent || ""');
            if (status === "Runtime ready.") break;
            if (status.includes("failed")) throw new Error("Frontend bootstrap failed: " + status);
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          if (status !== "Runtime ready.") throw new Error("Timed out waiting for frontend runtime: " + status);

          await evaluate(`(() => {
            const select = document.querySelector("#model");
            select.value = "50g";
            select.dispatchEvent(new Event("change", { bubbles: true }));
            return true;
          })()`);

          for (let i = 0; i < 20; i++) {
            const loaded = await evaluate(
              'document.querySelector("#skin")?.complete && document.querySelector("#skin")?.naturalWidth > 0'
            );
            if (loaded) break;
            await new Promise(resolve => setTimeout(resolve, 100));
          }

          const snapshot = JSON.parse(await evaluate(`JSON.stringify({
            isolated: crossOriginIsolated,
            status: document.querySelector("#bootstrap-status")?.textContent || "",
            models: Array.from(document.querySelectorAll("#model option")).map(option => option.value),
            startDisabled: document.querySelector("#start")?.disabled,
            startText: document.querySelector("#start")?.textContent || "",
            skin: document.querySelector("#skin")?.src || "",
            skinWidth: document.querySelector("#skin")?.naturalWidth || 0,
            skinHeight: document.querySelector("#skin")?.naturalHeight || 0,
            aspectRatio: document.querySelector("#calculator")?.style.aspectRatio || "",
            tabIndex: document.querySelector("#calculator")?.tabIndex
          })`));

          const expectedModels = ["39gp", "39gs", "40gs", "48gii", "49gp", "50g"];
          if (!snapshot.isolated) throw new Error("Frontend is not cross-origin isolated");
          if (snapshot.status !== "Runtime ready.") throw new Error("Unexpected runtime status: " + snapshot.status);
          if (snapshot.models.join(",") !== expectedModels.join(",")) throw new Error("Unexpected model list: " + snapshot.models.join(","));
          if (snapshot.startDisabled) throw new Error("Start button stayed disabled");
          if (snapshot.startText !== "Start HP 50g") throw new Error("Model switch did not update Start button: " + snapshot.startText);
          if (!snapshot.skin.endsWith("/skins/hp50g.svg")) throw new Error("Model switch did not update SVG skin: " + snapshot.skin);
          if (snapshot.skinWidth !== 665 || snapshot.skinHeight !== 1340) throw new Error("Unexpected SVG dimensions: " + snapshot.skinWidth + "x" + snapshot.skinHeight);
          if (snapshot.aspectRatio !== "665 / 1340") throw new Error("Unexpected calculator aspect ratio: " + snapshot.aspectRatio);
          if (snapshot.tabIndex !== 0) throw new Error("Calculator surface is not keyboard-focusable");

          console.log("PASS frontend UI", snapshot);
          socket.close();
          NODE

  browser-runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [39gp, 39gs, 40gs, 48gii, 49gp, 50g]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download browser site
        uses: actions/download-artifact@v4
        with:
          name: webemu48-browser-site
          path: dist

      - name: Prepare runtime smoke
        run: |
          cp web/demo/smoke.html dist/
          cp web/demo/smoke.js dist/
          cp app/src/main/assets/calculators/rom.39g dist/rom.39g
          cp app/src/main/assets/calculators/rom.49g dist/rom.49g

      - name: Start cross-origin-isolated server
        run: |
          cd dist
          nohup python3 serve.py > /tmp/webemu48-server.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/smoke.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/webemu48-server.log
          exit 1

      - name: Run Chromium runtime smoke
        env:
          SMOKE_MODEL: ${{ matrix.model }}
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/webemu48-chrome \
            about:blank \
            > /tmp/webemu48-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT

          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          node <<'NODE'
          const model = process.env.SMOKE_MODEL || "39gp";
          const targetUrl = "http://127.0.0.1:8000/smoke.html?model=" + encodeURIComponent(model);
          const targetResponse = await fetch(
            "http://127.0.0.1:9222/json/new?" + encodeURIComponent(targetUrl),
            { method: "PUT" }
          );
          if (!targetResponse.ok) throw new Error("Could not create Chromium target: " + targetResponse.status);

          const target = await targetResponse.json();
          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener("message", event => {
            const message = JSON.parse(event.data);
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(JSON.stringify(message.error)));
            else waiter.resolve(message.result);
          });

          function cdp(method, params = {}) {
            const id = nextId++;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }

          await cdp("Runtime.enable");

          const deadline = Date.now() + 35000;
          let last = { state: "loading", text: "Loading WebAssembly module" };

          while (Date.now() < deadline) {
            const result = await cdp("Runtime.evaluate", {
              expression: `JSON.stringify({
                state: document.documentElement.dataset.smoke || "loading",
                text: document.getElementById("status")?.textContent || ""
              })`,
              returnByValue: true
            });

            const value = result?.result?.value;
            if (value) last = JSON.parse(value);

            if (last.state === "pass") {
              console.log(last.text);
              socket.close();
              process.exit(0);
            }
            if (last.state === "fail") {
              console.error(last.text);
              socket.close();
              process.exit(1);
            }
            await new Promise(resolve => setTimeout(resolve, 250));
          }

          console.error("Timed out waiting for smoke result:", last);
          socket.close();
          process.exit(1);
          NODE
